//指定 Protobuf 版本
syntax = "proto3";



//指定包名
package erdai;
option java_multiple_files = true;




//定义一个学生的消息类
message Student{
  //姓名
  string name = 1;
  //年龄
  int32 age = 6;
  //邮箱
  string email = 8;
  //课程
  repeated string course = 4;

}

//定义一个天气的消息类
message Weather{
  int32 query = 1;

  //季节
  enum Season{
    option allow_alias = true;
    //春
    SPRING = 0;
    //夏
    SUMMER = 1;
    //秋
    FALL = 2;
    AUTUMN = 2;
    //冬
    WINTER = 3;
  }

  Season season = 2;
}
