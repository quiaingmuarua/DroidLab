plugins {
    id 'com.android.application'
    id 'com.google.protobuf'
}

android {
    namespace 'com.app.androidlab.sample'
    compileSdk 34

    defaultConfig {
        applicationId "com.app.androidlab.sample"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
//        externalNativeBuild {
//            cmake {
//                cppFlags ''
//            }
//        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
        aidl true
    }

    androidResources {
        noCompress 'aidl'
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt'
            ]
        }
    }
}
// 解决依赖版本冲突
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.10'
        force 'com.google.protobuf:protobuf-javalite:3.25.3'
        force 'io.grpc:grpc-core:1.59.0'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

// Protobuf 插件配置
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.59.0'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
            task.plugins {
                grpc {
                    // 使用 lite 运行�?
                    option "lite"
                }
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':crackme:crackme-native-lib')
    implementation "com.xa.mass:xa-mass-android-capability-http:${rootProject.ext.xaMassWorkerSdkVersion}"
    // gRPC - 更新到兼容版�?
    implementation "io.grpc:grpc-okhttp:1.59.0"
    implementation "io.grpc:grpc-protobuf-lite:1.59.0"
    implementation "io.grpc:grpc-stub:1.59.0"
    implementation "com.google.android.gms:play-services-cronet:18.0.1"

    // Protocol Buffers - 更新版本
    implementation 'com.google.protobuf:protobuf-javalite:3.25.3'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // Retrofit and OkHttp - 更新版本
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Other dependencies - AndroidX 统一版本
    // implementation project(':tools:nativelib')  // 单独编译时注释掉跨模块依�?
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Testing - 更新版本
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Hidden API bypass
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'


    implementation 'org.apache.thrift:libthrift:0.22.0'
    // Android �?Thrift 常用 slf4j-nop 防止找不到日志实现（可选）
    implementation 'org.slf4j:slf4j-nop:2.0.13'

    // �?Google Play Services 加载 Cronet（动态更新、支�?HTTP/3�?
    // 注释掉重复的Cronet依赖，上面已经声明过�?
}


