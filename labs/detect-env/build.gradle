import com.android.build.api.artifact.SingleArtifact

plugins {
    id 'com.android.application'
}

def workerRuntimeApiBaseUrl = providers
        .gradleProperty('agentforgeWorkerRuntimeApiBaseUrl')
        .getOrElse('')
def workerGroupId = providers
        .gradleProperty('agentforgeWorkerGroupId')
        .getOrElse('agentforge-detect-env-workers')

def duckSdk = new groovy.json.JsonSlurper().parse(file('duck-sdk.lock.json'))
def duckAar = rootProject.file(".runtime/duck-detector/sdk/${duckSdk.asset}")
if (!duckAar.isFile()) {
    throw new GradleException('Duck SDK is missing. Run: python -m agentforge_tools duck-sdk resolve')
}
def duckDigest = java.security.MessageDigest.getInstance('SHA-256')
duckAar.withInputStream { stream ->
    byte[] buffer = new byte[1024 * 1024]
    int count
    while ((count = stream.read(buffer)) != -1) {
        duckDigest.update(buffer, 0, count)
    }
}
if (duckDigest.digest().encodeHex().toString() != duckSdk.sha256) {
    throw new GradleException('Duck SDK SHA256 differs from duck-sdk.lock.json; refusing to build.')
}

android {
    namespace 'com.detect.app.sample'
    compileSdk 37
    ndkVersion libs.versions.ndk.get()

    defaultConfig {
        applicationId "com.detect.app.sample"
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName "1.0"

        ['TAG': duckSdk.tag, 'COMMIT': duckSdk.commit, 'SHA256': duckSdk.sha256].each { key, value ->
            buildConfigField 'String', "DUCK_SDK_${key}", groovy.json.JsonOutput.toJson(value)
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField(
                'String',
                'WORKER_RUNTIME_API_BASE_URL',
                groovy.json.JsonOutput.toJson(workerRuntimeApiBaseUrl)
        )
        buildConfigField(
                'String',
                'WORKER_GROUP_ID',
                groovy.json.JsonOutput.toJson(workerGroupId)
        )
//        externalNativeBuild {
//            cmake {
//                cppFlags ''
//            }
//        }
    }

    buildFeatures {
        buildConfig true
    }



    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'HardwareIdDetector'
        disable 'SoonBlockedPrivateApi'
        disable 'BlockedPrivateApi'
        disable 'DiscouragedPrivateApi'
    }
    
//    externalNativeBuild {
//        cmake {
//            path file('src/main/cpp/CMakeLists.txt')
//            version '3.22.1'
//        }
//    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation files(duckAar)
    duckSdk.dependencies.each { coordinate -> implementation coordinate }
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':crackme:crackme-native-lib')
    implementation "com.xa.mass:xa-mass-android-worker:${rootProject.ext.xaMassWorkerSdkVersion}"
    implementation "com.xa.mass:xa-mass-android-capability-http:${rootProject.ext.xaMassWorkerSdkVersion}"
    implementation 'com.google.code.gson:gson:2.8.8'
//    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation 'io.github.windysha:bypassHiddenApiRestriction:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'io.github.happylishang:antifake:1.7.0'
}

def workerProofProvenance = layout.buildDirectory.file(
        'outputs/worker-proof/detect-env-debug.provenance.json'
)
def workerProofApk = layout.buildDirectory.file(
        'outputs/worker-proof/detect-env-debug.apk'
)
def workerProofApkDirectory = objects.directoryProperty()
androidComponents.onVariants(androidComponents.selector().withBuildType('debug')) { variant ->
    workerProofApkDirectory.set(variant.artifacts.get(SingleArtifact.APK.INSTANCE))
}

tasks.register('workerProofArtifact') {
    group = 'verification'
    description = 'Builds the configured detect-env proof APK and provenance.'
    dependsOn 'testDebugUnitTest', 'assembleDebug'
    inputs.property('runtimeApiBaseUrl', workerRuntimeApiBaseUrl)
    inputs.property('workerGroupId', workerGroupId)
    inputs.dir(workerProofApkDirectory)
    outputs.file(workerProofProvenance)
    outputs.file(workerProofApk)
    outputs.upToDateWhen { false }

    doLast {
        def runtimeApi = workerRuntimeApiBaseUrl.trim()
        def groupId = workerGroupId.trim()
        if (!runtimeApi) {
            throw new GradleException(
                    'agentforgeWorkerRuntimeApiBaseUrl is required for Worker proof artifacts.'
            )
        }
        if (!groupId) {
            throw new GradleException(
                    'agentforgeWorkerGroupId is required for Worker proof artifacts.'
            )
        }
        def apkFile = workerProofApkDirectory.file('detect-env-debug.apk').get().asFile
        if (!apkFile.isFile()) {
            throw new GradleException("Worker proof APK is missing: ${apkFile}")
        }
        def packagedApk = workerProofApk.get().asFile
        packagedApk.parentFile.mkdirs()
        java.nio.file.Files.copy(
                apkFile.toPath(),
                packagedApk.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        apkFile.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def apkSha256 = digest.digest().collect {
            String.format('%02x', it & 0xff)
        }.join()
        def commit = providers.exec {
            commandLine 'git', '-C', rootProject.projectDir, 'rev-parse', 'HEAD'
        }.standardOutput.asText.get().trim()
        if (!(commit ==~ /[0-9a-f]{40}/)) {
            throw new GradleException('AgentForge HEAD is not a full Git SHA.')
        }
        def provenanceFile = workerProofProvenance.get().asFile
        def releaseLock = new groovy.json.JsonSlurper().parse(rootProject.file('XA_MASS_RELEASE.lock.json'))
        provenanceFile.parentFile.mkdirs()
        provenanceFile.text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson([
                        schemaVersion    : 2,
                        agentforgeCommit : commit,
                        artifactName     : packagedApk.name,
                        apkSha256        : apkSha256,
                        applicationId    : 'com.detect.app.sample',
                        buildVariant     : 'debug',
                        runtimeApiBaseUrl: runtimeApi,
                        workerGroupId    : groupId,
                        xaMassRelease    : [
                                version: releaseLock.version,
                                gitCommit: releaseLock.gitCommit,
                                runtimeZipSha256: releaseLock.assets.serverRuntime.sha256,
                                sdkZipSha256: releaseLock.assets.workerSdk.sha256,
                        ],
                ])
        ) + System.lineSeparator()
    }
}
